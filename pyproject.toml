[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "py-touch-mapper"
version = "0.1.0"
description = "Generate printable tactile maps from OpenStreetMap"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "CairoSVG>=2.7.1,<3",
    "defusedxml>=0.7.1,<1",
    "manifold3d==3.3.2",
    "numpy>=1.26,<3",
    "pymeshfix==0.18.1",
]

[project.scripts]
touch-mapper = "touch_mapper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
